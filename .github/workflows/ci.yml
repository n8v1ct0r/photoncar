name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Copy lint
        run: uv run python scripts/copy_lint.py
      - name: Privacy scan
        run: uv run python scripts/privacy_scan.py

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm build

  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: data/public
          key: comma2k19-${{ hashFiles('scripts/fetch_comma2k19_sample.py', 'scripts/comma2k19_manifest.json') }}
      - run: uv run python scripts/fetch_comma2k19_sample.py
      - name: Replay tests on the public dataset
        run: uv run pytest -m dataset
