THESIS: A drive is a roadbook: numbered boxes pinned to a time and a distance, each citing the signals that prove it. Refuses the dark gauge cluster with glowing arcs and the grid of analytics cards.
OWN-WORLD: Roll white paper #F5F7F7, tulip ink #111417, box rule #5B666D, caution red #C4161C for caution marks only, marker yellow #FFE600 and marker green #5EE38C as flat highlighter fills. Overpass with tabular figures; DSEG7 digits only in the live tripmeter. Ruled boxes, no radius, no shadow.
STORY: The owner sees what the car did, trusts each number because it points at its evidence, and exports laps.
FIRST VIEWPORT: Review at 1440: roadbook scroll left, map trace over stacked channel strips right, one time cursor; the selected box swiped yellow across strips and map; the safety line printed as the footer rule.
FORM: Rally roadbook, candidate 7 of 7, seed 14e368b3.

-->
